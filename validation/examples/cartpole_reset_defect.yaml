schema_version: ivf.validation/v1
name: cartpole-physx-reset-defect
description: >
  Explicit simulator-level reset perturbation on real Isaac Lab captures. It is modeled
  after a reset-semantics failure observed while developing the parity harness and fixed
  in upstream commit 9aaa389. It is not a literal reproduction of that historical case:
  this adapter writes zero cart-pole joint velocity instead of the requested 0.5 rad/s,
  while the historical harness omitted a rigid-body root velocity write. The bundle
  records the deliberate switch. IVF validity and oracle decisions do not consume that
  bookkeeping field; they establish the trajectory and event consequences.

subjects:
  baseline:
    kind: parity_bundle
    label: PhysX reference capture
    path: artifacts/cartpole-physx-baseline
  candidate:
    kind: parity_bundle
    label: PhysX capture with a test-only reset defect
    path: artifacts/cartpole-physx-reset-defect

workload:
  task: cartpole_passive
  num_envs: 16
  steps: 400
  warmup_steps: 0
  seeds: [0]

controls:
  require_same:
    - asset_identity
    - initial_state_distribution
    - observation_definition
    - control_frequency
    - num_envs
    - horizon
    - task_variant
    - solver_specific_parameters

oracles:
  - type: invariant
    name: finite_state
    check: finite_state

  - type: invariant
    name: unit_quaternion
    check: unit_quaternion
    signals: [root_link_quat_w]
    tolerance:
      value: 1.0e-5
      unit: dimensionless
      scope: deviation of |q| from 1, per element, per capture independently
      rationale: >
        Root quaternions are captured as float32 and promoted. 1e-5 is about 84 float32
        ULP at unit magnitude. It is an explicit numerical guard: a breach indicates
        materially non-unit captured data, not a claim about backend accuracy.
      aggregation: max
      min_samples: 1
      kind: numerical

  - type: trajectory_equivalence
    name: pole_angle_agreement
    signal: pole_angle
    metric: absolute
    tolerance:
      value: 2.88e-2
      unit: rad
      scope: per-step absolute pole-angle error, reduced over environments
      rationale: >
        The baseline pole crosses 1.0 rad at a measured median rate of 3.456 rad/s. At
        120 Hz, the local one-period angular displacement is 3.456 rad/s / 120 Hz =
        0.0288 rad. This engineering budget corresponds to one control period near that
        crossing. It does not guarantee that a sub-budget difference cannot change the
        sampled crossing index; the event oracle checks timing directly.
      aggregation: second_largest
      min_samples: 1600
      kind: engineering

  - type: trajectory_equivalence
    name: pole_velocity_agreement
    signal: pole_velocity
    metric: absolute
    tolerance:
      value: 9.094736842105263e-2
      unit: rad/s
      scope: per-step absolute pole angular-rate error, reduced over environments
      rationale: >
        Capture index 0 is the first post-reset step. The baseline median threshold index
        is 37, so median elapsed time is 38 / 120 = 0.3166667 s. Requiring a sustained
        pole-rate difference to accumulate no more than the 0.0288 rad angle budget over
        that measured median time gives 0.0288 rad / 0.3166667 s = 0.0909474 rad/s.

        This oracle exists because of what it observes, not only what it gates: a reset
        that drops velocity leaves position identical at step 0 and only diverges through
        integration, so a position-only manifest sees a smooth growing error and
        classifies it as drift. Watching the velocity is what makes the step-0 signature
        visible and the divergence classifiable.
      aggregation: second_largest
      min_samples: 1600
      kind: engineering

  - type: event_equivalence
    name: termination_timing
    event: termination
    signal: abs_pole_angle
    condition: above
    threshold: 1.0
    tolerance:
      value: 1
      unit: steps
      scope: absolute difference in the first step at which |pole angle| exceeds 1.0 rad
      rationale: >
        One control step is the finest resolution this workload has. A one-step timing
        difference is observable but explicitly permitted as a sampling allowance; two
        or more steps fails the declared event contract.
      aggregation: max
      min_samples: 8
      kind: event

  - type: decision_equivalence
    name: episode_survival
    decision: episode_survives_400_steps
    signal: abs_pole_angle
    condition: above
    threshold: 1.0
    polarity: survived
    tolerance:
      value: 1.0
      unit: fraction
      scope: fraction of environments whose survive/terminate outcome agrees
      rationale: >
        This is the decision a consumer actually reads off this workload, so any
        disagreement is operationally meaningful. With 16 paired environments the finest
        resolvable rate below 1.0 is 0.9375, so a weaker threshold would be a statement
        about the sample size rather than about the workload.
      aggregation: all
      min_samples: 8
      kind: engineering

  - type: statistical_equivalence
    name: mean_pole_angle_equivalence
    signal: pole_angle
    summary: mean
    tolerance:
      value: 1.44e-2
      unit: rad
      scope: horizon-mean pole angle per environment, paired across captures
      rationale: >
        Half the one-control-step angle budget above: 0.5 * 0.0288 = 0.0144 rad. The
        horizon-mean margin is deliberately tighter than the pointwise allowance so a
        persistent shift is held to a stronger criterion than a transient difference.
      aggregation: mean
      min_samples: 16
      kind: statistical
      minimum_meaningful_effect: 1.0e-3

  - type: metamorphic
    name: observation_shape_stability
    relation: observation_definition_stability

verdict_policy:
  invalid_experiment_on_control_violation: true
  inconclusive_on_insufficient_samples: true
  unsupported_is_failure: false

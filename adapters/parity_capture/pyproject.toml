[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivf-parity-capture"
version = "0.1.0rc1"
description = "Isaac Lab capture adapter producing trajectory_bundle/v1 for IVF."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yusuf Guenena"}]
requires-python = ">=3.10"

# Deliberately thin. `ivf` provides the trajectory_bundle/v1 writer and nothing else;
# Isaac Lab is NOT declared here because it is never installed from PyPI in practice.
# This package is installed into an environment that already has the simulator, which
# `parity-capture doctor` verifies before any capture is attempted.
dependencies = [
    "ivf==0.1.0rc1",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.scripts]
parity-capture = "parity_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parity_capture", "parity_capture.*"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivf-parity-capture"
version = "0.1.0rc1"
description = "Isaac Lab capture adapter producing trajectory_bundle/v1 for IVF."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yusuf Guenena"}]
requires-python = ">=3.10"

# Deliberately thin. Isaac Lab is not declared because it is never installed from PyPI
# in practice. This package is installed into an environment that already has the
# simulator, which `parity-capture doctor` verifies before capture. IVF is also absent:
# the integration boundary is the versioned bundle on disk, not a Python dependency.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.scripts]
parity-capture = "parity_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parity_capture", "parity_capture.*"]

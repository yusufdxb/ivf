schema_version: ivf.validation/v1
name: cartpole-v1-physx-vs-newton
description: >
  Real trajectory_bundle/v1 captures of the same passive cart-pole task executed with
  PhysX and Newton/MJWarp. This is an acceptance result for the declared workload and
  controls. It does not designate either backend as correct, establish cross-hardware
  determinism, or predict learned-policy transfer or sim-to-real behavior.

subjects:
  baseline:
    kind: parity_bundle
    label: PhysX v1 capture
    path: artifacts/cartpole-physx-baseline
    bundle_sha256: 7149a5e77a32d12b01d1d859c22a6c6f9cefba9cf9e6374f20670ce4a4dd40bf
  candidate:
    kind: parity_bundle
    label: Newton MJWarp v1 capture
    path: artifacts/cartpole-newton-baseline
    bundle_sha256: d88c6a9f37d3dc40eca564a2f62eb5321242553a12200228f9924cb6dd7ad3d3

workload:
  task: cartpole_passive
  num_envs: 16
  steps: 400
  warmup_steps: 0
  seeds: [0]

controls:
  require_same:
    - asset_identity
    - action_sequence
    - initial_state_distribution
    - observation_definition
    - control_frequency
    - seeds
    - num_envs
    - horizon
    - task_variant
    - frame_convention
    - quaternion_convention
    - reset_semantics
    - environment_ordering
    - action_timing
  allow_different:
    - solver_specific_parameters
  unsupported_or_unverifiable:
    - asset_binary_identity
    - initial_state_realization
    - backend_internal_state

oracles:
  - type: invariant
    name: finite_state
    check: finite_state

  - type: invariant
    name: unit_quaternion
    check: unit_quaternion
    signals: [root_link_quat_w]
    tolerance:
      value: 1.0e-5
      unit: dimensionless
      scope: deviation of |q| from 1, per element, per backend independently
      rationale: >
        Root quaternions are captured as float32 and promoted. 1e-5 is about 84 float32
        ULP at unit magnitude. It is an explicit numerical guard for materially non-unit
        captured data, not a backend accuracy estimate.
      aggregation: max
      min_samples: 1
      kind: numerical

  - type: trajectory_equivalence
    name: pole_angle_agreement
    signal: pole_angle
    metric: absolute
    tolerance:
      value: 2.88e-2
      unit: rad
      scope: per-step absolute pole-angle error, reduced over environments
      rationale: >
        The PhysX baseline pole crosses 1.0 rad at a measured median rate of 3.456 rad/s.
        At 120 Hz, the local one-period displacement is 3.456 rad/s / 120 Hz = 0.0288
        rad. This is a workload timing allowance, not a physical-correctness bound.
      aggregation: second_largest
      min_samples: 1600
      kind: engineering

  - type: trajectory_equivalence
    name: pole_velocity_agreement
    signal: pole_velocity
    metric: absolute
    tolerance:
      value: 9.094736842105263e-2
      unit: rad/s
      scope: per-step absolute pole angular-rate error, reduced over environments
      rationale: >
        The median PhysX threshold index 37 is 38 elapsed post-reset periods, or
        0.3166667 s at 120 Hz. The pole-only budget is 0.0288 rad / 0.3166667 s =
        0.0909474 rad/s. It never mixes cart m/s with pole rad/s.
      aggregation: second_largest
      min_samples: 1600
      kind: engineering

  - type: event_equivalence
    name: termination_timing
    event: termination
    signal: abs_pole_angle
    condition: above
    threshold: 1.0
    tolerance:
      value: 1
      unit: steps
      scope: absolute difference in first sample where |pole angle| exceeds 1.0 rad
      rationale: >
        A one-step difference is observable but explicitly permitted as the declared
        120 Hz sampling allowance. Two or more steps fails the event contract.
      aggregation: max
      min_samples: 8
      kind: event

  - type: decision_equivalence
    name: episode_survival
    decision: episode_survives_400_steps
    signal: abs_pole_angle
    condition: above
    threshold: 1.0
    polarity: survived
    tolerance:
      value: 1.0
      unit: fraction
      scope: fraction of paired environments with the same survive or terminate decision
      rationale: >
        Any paired semantic decision disagreement is material for this declared
        workload. This is exact sample agreement, not a population probability.
      aggregation: all
      min_samples: 8
      kind: engineering

  - type: statistical_equivalence
    name: mean_pole_angle_equivalence
    signal: pole_angle
    summary: mean
    tolerance:
      value: 1.44e-2
      unit: rad
      scope: horizon-mean pole angle per environment, paired across backends
      rationale: >
        Half the pointwise timing allowance: 0.5 * 0.0288 = 0.0144 rad. A persistent
        mean shift is held to a tighter margin than a transient pointwise difference.
      aggregation: mean
      min_samples: 16
      kind: statistical
      minimum_meaningful_effect: 1.0e-3

  - type: metamorphic
    name: observation_shape_stability
    relation: observation_definition_stability

  - type: metamorphic
    name: action_replay
    relation: action_replay_consumption

verdict_policy:
  invalid_experiment_on_control_violation: true
  inconclusive_on_insufficient_samples: true
  unsupported_is_failure: false
